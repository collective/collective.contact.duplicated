[buildout]
always-checkout = force
auto-checkout +=

[remotes]
imio = https://github.com/imio
imio_push = git@github.com:imio
plone = https://github.com/plone
plone_push = git@github.com:plone
ftw = https://github.com/4teamwork
ftw_push = git@github.com:4teamwork
zopefoundation = https://github.com/zopefoundation
zopefoundation_push = git@github.com:zopefoundation
zopesvn = svn://svn.zope.org/repos/main/
col = https://github.com/collective
col_push = git@github.com:collective

[sources]
imio.helpers = git ${remotes:imio}/imio.helpers.git pushurl=${remotes:imio_push}/imio.helpers.git
# Plone 6 branches of the dependencies, not released yet (auto-checkout in test-6.2.cfg)
collective.contact.core = git ${remotes:col}/collective.contact.core.git pushurl=${remotes:col_push}/collective.contact.core.git branch=python3-chris-adam
collective.contact.facetednav = git ${remotes:col}/collective.contact.facetednav.git pushurl=${remotes:col_push}/collective.contact.facetednav.git branch=plone6-chris-adam
collective.contact.widget = git ${remotes:col}/collective.contact.widget.git pushurl=${remotes:col_push}/collective.contact.widget.git branch=python3-chris-adam
# required by the dependency branches above
collective.js.tooltipster = git ${remotes:col}/collective.js.tooltipster.git pushurl=${remotes:col_push}/collective.js.tooltipster.git branch=plone61-chris-adam
eea.facetednavigation = git https://github.com/chris-adam/eea.facetednavigation.git branch=develop-chris-adam
plone.formwidget.contenttree = git ${remotes:plone}/plone.formwidget.contenttree.git pushurl=${remotes:plone_push}/plone.formwidget.contenttree.git branch=python3
plone.formwidget.masterselect = git ${remotes:col}/plone.formwidget.masterselect.git pushurl=${remotes:col_push}/plone.formwidget.masterselect.git branch=master
